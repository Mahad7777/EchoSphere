apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-config
  labels:
    app: zookeeper
    component: configuration
data:
  # Zookeeper Configuration
  ZOO_TICK_TIME: "2000"
  ZOO_INIT_LIMIT: "10"
  ZOO_SYNC_LIMIT: "5"
  ZOO_MAX_CLIENT_CNXNS: "60"
  ZOO_STANDALONE_ENABLED: "true"
  ZOO_ADMINSERVER_ENABLED: "true"
