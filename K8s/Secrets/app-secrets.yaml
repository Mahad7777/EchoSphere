apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: backend
    component: secrets
type: Opaque
stringData:
  # MongoDB Connection String
  # NOTE: In production, consider using:
  # 1. External Secrets Operator with cloud secret managers (AWS Secrets Manager, GCP Secret Manager)
  # 2. HashiCorp Vault
  # 3. Sealed Secrets for GitOps workflows
  MONGO_CONNECT_STRING: "mongodb://mongo-db:27017/scalable-chat-app-db"

  # Add other sensitive data here as needed:
  # DB_USERNAME: "admin"
  # DB_PASSWORD: "your-secure-password"
  # JWT_SECRET: "your-jwt-secret"
  # API_KEYS: "your-api-keys"
---
# MongoDB Credentials Secret (if you need separate DB authentication)
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  labels:
    app: mongodb
    component: secrets
type: Opaque
stringData:
  # Uncomment and configure when you enable MongoDB authentication
  # mongodb-root-username: "admin"
  # mongodb-root-password: "change-this-secure-password"
  # mongodb-username: "chatapp"
  # mongodb-password: "change-this-secure-password"
  mongodb-database: "scalable-chat-app-db"
